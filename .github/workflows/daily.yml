name: Daily podcast

on:
  schedule:
    - cron: "30 0 * * *"   # 每天 08:30 台北時間（GitHub 排程可能延遲數分鐘）
  workflow_dispatch:
    inputs:
      notify_only:
        description: "只重送今天的 Telegram / LINE（不重新產生）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          pip install -r requirements.txt
          say -v "?" | grep -E "^(Meijia|Samantha) " || echo "⚠️ voice missing"

      - name: Check out published site
        run: |
          git fetch origin gh-pages
          git worktree add site origin/gh-pages

      - name: Build episodes and feed
        if: ${{ !inputs.notify_only }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python podcast/build.py site

      - name: Publish (single-commit gh-pages)
        if: ${{ !inputs.notify_only }}
        working-directory: site
        run: |
          git config user.name "hermes-podcast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publish
          git add -A
          git commit -m "Publish $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push -f origin HEAD:gh-pages

      - name: Notify Telegram / LINE
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: python podcast/notify.py site
